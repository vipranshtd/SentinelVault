<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SentinelVault{% endblock %}</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="brand">SENTINEL<span>VAULT</span></div>

        <div class="nav-right">
            <div class="nav-tag">SECURE FILE PROTECTION</div>

            <div class="nav-actions">
                {% if current_user.is_authenticated %}
                    <a href="/dashboard" class="nav-button">DASHBOARD</a>

                    <form action="/logout" method="POST">
                        <input type="hidden" name="csrf_token"
                               value="{{ csrf_token() }}">
                        <button type="submit" class="nav-button logout-button">
                            LOGOUT
                        </button>
                    </form>
                {% else %}
                    <a href="/login" class="nav-button">LOGIN</a>
                    <a href="/register" class="nav-button register-button">
                        GET STARTED
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        SentinelVault &copy; 2026 | Secure Your Digital Assets
    </footer>

</body>
</html>
